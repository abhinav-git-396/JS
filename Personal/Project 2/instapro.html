<!DOCTYPE html>
<html>

<head>
    <title>instapro.com</title>
    <link rel="stylesheet" href="instapro.css">
</head>

<body>
    <div class="full">
        <div class="left">
            <img src="half.png">
        </div>

        <div class="right">

            <div class="header">
                <button class="back-btn">
                    <img src="back-button.png">
                </button>
                <h3 class="first">Log into instapro</h3>
            </div>

            <div>
                <form>
                    <label for="email"></label>
                    <input type="email" id="email" placeholder="Mobile number, username or email">
                    <br>
                    <label for="password"></label>
                    <input type="password" id="password" placeholder="Password">
                    <br>
                    <div class="buttons">
                        <button class="log" ;>Log in</button>
                        <br>
                        <button class="forget">Forget password?</button>
                        <br>
                        <button class="facebook">
                            <img src="facebook.png">
                            <span>Log in with Facebook</span>
                        </button>
                        <br>
                        <button class="account">Create new account</button>
                        <div class="meta">
                            <img src="meta.png" alt="Meta">
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </div>
    <footer class="footer">
<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
    <div class="footer-links">
        <a href="#">Meta</a>
        <a href="#">About</a>
        <a href="#">Blog</a>
        <a href="#">Jobs</a>
        <a href="#">Help</a>
        <a href="#">API</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Locations</a>
        <a href="#">Popular</a>
        <a href="#">Instagram Lite</a>
        <a href="#">Meta AI</a>
        <a href="#">Muse</a>
        <a href="#">Threads</a>
        <a href="#">Contact Uploading & Non-Users</a>
        <a href="#">Meta Verified</a>
    </div>

    <div class="footer-bottom">

        <div class="language">
            <span>English</span>
            <span class="arrow"></span>
        </div>

        <div class="copyright">
            © 2026 Instagram from Meta
        </div>

    </div>

</footer>


</body>

</html>
